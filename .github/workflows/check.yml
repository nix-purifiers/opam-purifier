# SPDX-License-Identifier: MIT
#
# Runs on x86_64-linux and aarch64-linux. The `check` job runs the flake's
# checks: the CLI build, the sandboxed builds of the fixtures and of
# ocaml-uri from their lockfiles with a run of what they build, the
# conformance checks the sandbox can run, and the formatting. The
# conformance checks that need the network, a second build or a network
# namespace run as jobs of the same name, from tests/interactive.sh, and
# the `integration` job
# runs the rest of that script: the lock run against opam's own lock
# files, publishing, the CLI's failures, and the git, Darcs and Mercurial
# sources.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L

  interactive:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        section:
          - conformance-relock
          - conformance-offline
          - conformance-rebuild
          - conformance-update
          - integration
    name: ${{ matrix.section }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - if: matrix.section != 'integration'
        run: tests/interactive.sh ${{ matrix.section }}
      - if: matrix.section == 'integration'
        run: tests/interactive.sh lockfiles publish negative repository darcs hg
